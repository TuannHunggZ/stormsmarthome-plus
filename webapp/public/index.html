<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storm Smart Home Alerts</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Realtime anomaly feed</p>
          <h1>Storm Smart Home Alerts</h1>
          <p class="lede">Redis Pub/Sub to WebSocket to browser, without polling.</p>
        </div>
        <div class="status-card">
          <span id="connectionStatus" class="status disconnected">Disconnected</span>
          <p>WebSocket connection</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Latest alerts</h2>
          <p id="alertCount">0 alerts</p>
        </div>
        <div id="alertList" class="alert-list"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
